site_name: cdriv
site_description: Control Chromium via ChromeDriver on Termux — Playwright/Selenium alternative for Android aarch64
site_url: https://draken119.github.io/cdriv/
repo_url: https://github.com/Draken119/cdriv
repo_name: Draken119/cdriv
edit_uri: blob/master/docs/
site_author: Draken119
copyright: Copyright &copy; 2026 Draken119 — MIT License

theme:
  name: material
  custom_dir: overrides
  icon:
    logo: material/web
    repo: fontawesome/brands/github
  palette:
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    # - navigation.instant  # incompatible with i18n language switcher
    # - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow
  language: en

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_category_heading: true
            docstring_style: google
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
          nav_translations:
            site_name: cdriv
        - locale: es
          name: Español
          build: true
          nav_translations:
            site_name: cdriv
        - locale: pt
          name: Português
          build: true
          nav_translations:
            site_name: cdriv
        - locale: ru
          name: Русский
          build: true
          nav_translations:
            site_name: cdriv
        - locale: zh
          name: 中文
          build: true
          nav_translations:
            site_name: cdriv
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            site_name: cdriv

nav:
  - Home: index.md
  - Installation:
    - Installation: installation.md
    - Prerequisites: prerequisites.md
  - Usage Guide:
    - Quickstart: usage/quickstart.md
    - Navigation: usage/navigation.md
    - Data Extraction: usage/extraction.md
    - Cookies: usage/cookies.md
    - Element Interaction: usage/interaction.md
    - JavaScript: usage/javascript.md
    - Screenshot: usage/screenshot.md
    - Scroll: usage/scroll.md
    - Waits: usage/waits.md
    - Storage: usage/storage.md
    - Utilities: usage/utilities.md
  - Practical Examples:
    - Login + API: examples/login.md
    - Multi-page Scraping: examples/scraping.md
    - Infinite Scroll: examples/infinite-scroll.md
    - Price Monitoring: examples/price-monitor.md
    - Form Automation: examples/form.md
  - API Reference:
    - CDriv: api/cdriv.md
  - Troubleshooting: troubleshooting.md
  - About: about.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Draken119/cdriv
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/cdriv/
  generator: false
  alternate:
    - name: 🇺🇸 English
      link: /en/
      lang: en
    - name: 🇪🇸 Español
      link: /es/
      lang: es
    - name: 🇧🇷 Português
      link: /pt/
      lang: pt
    - name: 🇷🇺 Русский
      link: /ru/
      lang: ru
    - name: 🇨🇳 中文
      link: /zh/
      lang: zh
    - name: 🇯🇵 日本語
      link: /ja/
      lang: ja

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.critic
  - toc:
      permalink: true
      toc_depth: 3
